<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Ciclos de Avaliação</h1>
        <button class="btn btn-roxo" data-bs-toggle="modal" data-bs-target="#modal-ciclo" onclick="abrirModalNovo()">
          <i class="bi bi-plus-lg"></i> Novo Ciclo
        </button>
      </div>
      <div class="cartao-conteudo">
        <div id="area-tabela">
          <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-ciclo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-ciclo">
          <div class="modal-header">
            <h5 class="modal-title">Novo Ciclo de Avaliação</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-modal" class="alert alert-danger d-none"></div>
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required />
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Data de início</label>
                <input type="date" class="form-control" id="dataInicio" required />
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Data de fim</label>
                <input type="date" class="form-control" id="dataFim" required />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo</label>
              <select class="form-select" id="tipo" required>
                <option value="90">90° (apenas líder)</option>
                <option value="180">180° (autoavaliação + líder)</option>
                <option value="360">360° (completo)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-roxo">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-encerrar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-encerrar">
          <div class="modal-header">
            <h5 class="modal-title">Encerrar Ciclo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-encerrar" class="alert alert-warning d-none"></div>
            <input type="hidden" id="encerrar-ciclo-id" />
            <p>Se houver avaliações pendentes, informe uma justificativa para encerrar mesmo assim.</p>
            <div class="mb-3">
              <label class="form-label">Justificativa (opcional se 100% concluído)</label>
              <textarea class="form-control" id="justificativa" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-roxo">Confirmar Encerramento</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('ciclos.html');

    let modalCiclo, modalEncerrar;
    let cache = [];

    async function carregarTabela() {
      const areaTabela = document.getElementById('area-tabela');
      try {
        const resultado = await apiFetch('/ciclos-avaliacao?tamanhoPagina=100');
        cache = resultado.registros;

        if (cache.length === 0) {
          areaTabela.innerHTML = '<p class="estado-vazio">Nenhum ciclo cadastrado ainda.</p>';
          return;
        }

        const linhas = cache.map((c) => `
          <tr>
            <td class="valor-dado">${c.nome}</td>
            <td>${c.tipo}°</td>
            <td>${c.data_inicio} a ${c.data_fim}</td>
            <td><span class="badge-status ${c.status}">${c.status.replace('_', ' ')}</span></td>
            <td class="text-end">
              ${c.status === 'planejado' ? `<button class="btn btn-sm btn-roxo" onclick="abrirCiclo('${c.id}')"><i class="bi bi-play-fill"></i> Abrir</button>` : ''}
              ${c.status === 'em_andamento' ? `<button class="btn btn-sm btn-outline-danger" onclick="abrirModalEncerrar('${c.id}')"><i class="bi bi-stop-fill"></i> Encerrar</button>` : ''}
            </td>
          </tr>`).join('');

        areaTabela.innerHTML = `
          <table class="table tabela-padrao">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Período</th><th>Status</th><th></th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>`;
      } catch (erro) {
        areaTabela.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    function abrirModalNovo() {
      document.getElementById('form-ciclo').reset();
      document.getElementById('alerta-modal').classList.add('d-none');
    }

    document.getElementById('form-ciclo').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const alertaModal = document.getElementById('alerta-modal');
      alertaModal.classList.add('d-none');
      const payload = {
        nome: document.getElementById('nome').value.trim(),
        dataInicio: document.getElementById('dataInicio').value,
        dataFim: document.getElementById('dataFim').value,
        tipo: document.getElementById('tipo').value,
      };
      try {
        await apiFetch('/ciclos-avaliacao', { method: 'POST', body: JSON.stringify(payload) });
        modalCiclo.hide();
        carregarTabela();
      } catch (erro) {
        alertaModal.textContent = erro.detalhes?.erros?.join(' ') || erro.message;
        alertaModal.classList.remove('d-none');
      }
    });

    async function abrirCiclo(id) {
      if (!confirm('Abrir este ciclo ira gerar automaticamente todas as avaliacoes pendentes. Confirma?')) return;
      try {
        const resultado = await apiFetch(`/ciclos-avaliacao/${id}/abrir`, { method: 'PATCH' });
        alert(`Ciclo aberto! ${resultado.totalAvaliacoesGeradas} avaliação(ões) geradas.`);
        carregarTabela();
      } catch (erro) {
        alert(erro.message);
      }
    }

    function abrirModalEncerrar(id) {
      document.getElementById('encerrar-ciclo-id').value = id;
      document.getElementById('justificativa').value = '';
      document.getElementById('alerta-encerrar').classList.add('d-none');
      modalEncerrar.show();
    }

    document.getElementById('form-encerrar').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const id = document.getElementById('encerrar-ciclo-id').value;
      const justificativa = document.getElementById('justificativa').value.trim() || undefined;
      const alertaEncerrar = document.getElementById('alerta-encerrar');
      alertaEncerrar.classList.add('d-none');
      try {
        await apiFetch(`/ciclos-avaliacao/${id}/encerrar`, { method: 'PATCH', body: JSON.stringify({ justificativa }) });
        modalEncerrar.hide();
        carregarTabela();
      } catch (erro) {
        alertaEncerrar.textContent = erro.message;
        alertaEncerrar.classList.remove('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      modalCiclo = new bootstrap.Modal(document.getElementById('modal-ciclo'));
      modalEncerrar = new bootstrap.Modal(document.getElementById('modal-encerrar'));
    });

    carregarTabela();
  </script>
</body>
</html>
