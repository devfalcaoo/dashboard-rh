<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargos - Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Cargos</h1>
        <button class="btn btn-roxo" data-bs-toggle="modal" data-bs-target="#modal-cargo" onclick="abrirModalNovo()">
          <i class="bi bi-plus-lg"></i> Novo Cargo
        </button>
      </div>
      <div class="cartao-conteudo">
        <div id="area-tabela">
          <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-cargo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-cargo">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-modal">Novo Cargo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-modal" class="alert alert-danger d-none"></div>
            <input type="hidden" id="cargo-id" />
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Nível</label>
              <select class="form-select" id="nivel">
                <option value="junior">Júnior</option>
                <option value="pleno">Pleno</option>
                <option value="senior">Sênior</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Departamento</label>
              <select class="form-select" id="departamentoId"><option value="">-</option></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-roxo">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('cargos.html');

    let modalCargo;
    let cache = [];
    let departamentosCache = [];

    async function carregarSelectDepartamentos() {
      const resultado = await apiFetch('/departamentos?tamanhoPagina=200');
      departamentosCache = resultado.registros;
      const select = document.getElementById('departamentoId');
      select.innerHTML = '<option value="">-</option>' + departamentosCache.map((d) => `<option value="${d.id}">${d.nome}</option>`).join('');
    }

    function nomeDepartamento(id) {
      return departamentosCache.find((d) => d.id === id)?.nome || '-';
    }

    async function carregarTabela() {
      const areaTabela = document.getElementById('area-tabela');
      try {
        if (departamentosCache.length === 0) await carregarSelectDepartamentos();
        const resultado = await apiFetch('/cargos?tamanhoPagina=100');
        cache = resultado.registros;

        if (cache.length === 0) {
          areaTabela.innerHTML = '<p class="estado-vazio">Nenhum cargo cadastrado ainda.</p>';
          return;
        }

        const linhas = cache.map((c) => `
          <tr>
            <td class="valor-dado">${c.nome}</td>
            <td>${c.nivel || '-'}</td>
            <td>${nomeDepartamento(c.departamento_id)}</td>
            <td><span class="badge-status ${c.ativo ? 'concluida' : 'cancelada'}">${c.ativo ? 'Ativo' : 'Inativo'}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary" onclick="abrirModalEditar('${c.id}')"><i class="bi bi-pencil"></i> Editar</button>
            </td>
          </tr>`).join('');

        areaTabela.innerHTML = `
          <table class="table tabela-padrao">
            <thead><tr><th>Nome</th><th>Nível</th><th>Departamento</th><th>Status</th><th></th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>`;
      } catch (erro) {
        areaTabela.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    async function abrirModalNovo() {
      document.getElementById('form-cargo').reset();
      document.getElementById('cargo-id').value = '';
      document.getElementById('titulo-modal').textContent = 'Novo Cargo';
      document.getElementById('alerta-modal').classList.add('d-none');
      await carregarSelectDepartamentos();
    }

    async function abrirModalEditar(id) {
      const cargo = cache.find((c) => c.id === id);
      await carregarSelectDepartamentos();
      document.getElementById('cargo-id').value = cargo.id;
      document.getElementById('titulo-modal').textContent = 'Editar Cargo';
      document.getElementById('nome').value = cargo.nome;
      document.getElementById('nivel').value = cargo.nivel || 'junior';
      document.getElementById('departamentoId').value = cargo.departamento_id || '';
      document.getElementById('alerta-modal').classList.add('d-none');
      modalCargo.show();
    }

    document.getElementById('form-cargo').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const alertaModal = document.getElementById('alerta-modal');
      alertaModal.classList.add('d-none');
      const id = document.getElementById('cargo-id').value;

      const payload = {
        nome: document.getElementById('nome').value.trim(),
        nivel: document.getElementById('nivel').value,
        departamentoId: document.getElementById('departamentoId').value || undefined,
      };

      try {
        if (id) {
          await apiFetch(`/cargos/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          await apiFetch('/cargos', { method: 'POST', body: JSON.stringify(payload) });
        }
        modalCargo.hide();
        carregarTabela();
      } catch (erro) {
        alertaModal.textContent = erro.detalhes?.erros?.join(' ') || erro.message;
        alertaModal.classList.remove('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      modalCargo = new bootstrap.Modal(document.getElementById('modal-cargo'));
    });

    carregarTabela();
  </script>
</body>
</html>
