<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificações - Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Notificações</h1>
        <button class="btn btn-outline-secondary btn-sm" onclick="marcarTodasComoLidas()">Marcar todas como lidas</button>
      </div>
      <div class="cartao-conteudo">
        <div id="area-lista">
          <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('notificacoes.html');

    async function carregarLista() {
      const areaLista = document.getElementById('area-lista');
      try {
        const resultado = await apiFetch('/notificacoes?tamanhoPagina=100');
        if (resultado.registros.length === 0) {
          areaLista.innerHTML = '<p class="estado-vazio">Nenhuma notificação até o momento.</p>';
          return;
        }
        areaLista.innerHTML = resultado.registros
          .map(
            (notificacao) => `
            <div class="border-bottom py-3 d-flex justify-content-between align-items-start ${notificacao.lida ? 'opacity-50' : ''}">
              <div>
                <p class="mb-1 fw-semibold">${notificacao.titulo}</p>
                <p class="mb-1">${notificacao.mensagem}</p>
                <small class="text-muted">${new Date(notificacao.created_at).toLocaleString('pt-BR')}</small>
              </div>
              ${!notificacao.lida ? `<button class="btn btn-sm btn-outline-secondary" onclick="marcarComoLida('${notificacao.id}')">Marcar como lida</button>` : ''}
            </div>`
          )
          .join('');
      } catch (erro) {
        areaLista.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    async function marcarComoLida(id) {
      await apiFetch(`/notificacoes/${id}/lida`, { method: 'PATCH' });
      carregarLista();
    }

    async function marcarTodasComoLidas() {
      await apiFetch('/notificacoes/marcar-todas-como-lidas', { method: 'PATCH' });
      carregarLista();
    }

    carregarLista();
  </script>
</body>
</html>
