<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Minhas Avaliações</h1>
      </div>

      <div class="cartao-conteudo">
        <div id="area-lista">
          <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de resposta -->
  <div class="modal fade" id="modal-responder" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Responder avaliação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="corpo-modal-responder">
          <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-outline-primary" id="botao-salvar-notas">Salvar notas</button>
          <button type="button" class="btn btn-roxo" id="botao-concluir">Concluir avaliação</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('avaliacoes.html');

    let modalResponder;
    let avaliacaoAtualId = null;

    async function carregarLista() {
      const areaLista = document.getElementById('area-lista');
      try {
        const resultado = await apiFetch('/avaliacoes/minhas?tamanhoPagina=100');

        if (resultado.registros.length === 0) {
          areaLista.innerHTML = '<p class="estado-vazio">Você não possui avaliações no momento.</p>';
          return;
        }

        const linhas = resultado.registros
          .map(
            (avaliacao) => `
            <tr>
              <td class="text-capitalize">${avaliacao.tipo.replace('_', ' ')}</td>
              <td><span class="badge-status ${avaliacao.status}">${avaliacao.status.replace('_', ' ')}</span></td>
              <td class="valor-dado">${avaliacao.nota_final ?? '-'}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-roxo" ${avaliacao.status === 'concluida' ? 'disabled' : ''} onclick="abrirModalResponder('${avaliacao.id}')">
                  ${avaliacao.status === 'concluida' ? 'Concluída' : 'Responder'}
                </button>
              </td>
            </tr>`
          )
          .join('');

        areaLista.innerHTML = `
          <table class="table tabela-padrao">
            <thead><tr><th>Tipo</th><th>Status</th><th>Nota final</th><th></th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>`;
      } catch (erro) {
        areaLista.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    async function abrirModalResponder(id) {
      avaliacaoAtualId = id;
      modalResponder.show();
      const corpo = document.getElementById('corpo-modal-responder');
      corpo.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';

      try {
        const [avaliacao, competencias] = await Promise.all([
          apiFetch(`/avaliacoes/${id}`),
          apiFetch('/competencias?tamanhoPagina=200&ativo=true'),
        ]);

        const mapaNotasExistentes = new Map(avaliacao.itens.map((item) => [item.competencia_id, item]));

        corpo.innerHTML = competencias.registros
          .map((competencia) => {
            const itemExistente = mapaNotasExistentes.get(competencia.id);
            return `
              <div class="mb-3 border-bottom pb-3">
                <label class="form-label fw-semibold">${competencia.nome}</label>
                <div class="row g-2">
                  <div class="col-3">
                    <input type="number" min="0" max="10" step="0.1" class="form-control input-nota"
                      data-competencia-id="${competencia.id}" value="${itemExistente?.nota ?? ''}" placeholder="Nota" />
                  </div>
                  <div class="col-9">
                    <input type="text" class="form-control input-comentario"
                      data-competencia-id="${competencia.id}" value="${itemExistente?.comentario ?? ''}" placeholder="Comentário (opcional)" />
                  </div>
                </div>
              </div>`;
          })
          .join('');
      } catch (erro) {
        corpo.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    function coletarItensDoFormulario() {
      const notas = [...document.querySelectorAll('.input-nota')];
      return notas
        .filter((campo) => campo.value !== '')
        .map((campo) => ({
          competenciaId: campo.dataset.competenciaId,
          nota: Number(campo.value),
          comentario: document.querySelector(`.input-comentario[data-competencia-id="${campo.dataset.competenciaId}"]`)?.value || undefined,
        }));
    }

    document.getElementById('botao-salvar-notas').addEventListener('click', async () => {
      try {
        const itens = coletarItensDoFormulario();
        await apiFetch(`/avaliacoes/${avaliacaoAtualId}/itens`, { method: 'POST', body: JSON.stringify({ itens }) });
        alert('Notas salvas com sucesso.');
        carregarLista();
      } catch (erro) {
        alert(erro.message);
      }
    });

    document.getElementById('botao-concluir').addEventListener('click', async () => {
      try {
        const itens = coletarItensDoFormulario();
        if (itens.length > 0) {
          await apiFetch(`/avaliacoes/${avaliacaoAtualId}/itens`, { method: 'POST', body: JSON.stringify({ itens }) });
        }
        await apiFetch(`/avaliacoes/${avaliacaoAtualId}/concluir`, { method: 'POST' });
        modalResponder.hide();
        carregarLista();
      } catch (erro) {
        alert(erro.detalhes?.competenciasFaltando ? `Faltam notas para: ${erro.detalhes.competenciasFaltando.join(', ')}` : erro.message);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      modalResponder = new bootstrap.Modal(document.getElementById('modal-responder'));
    });

    carregarLista();
  </script>
</body>
</html>
