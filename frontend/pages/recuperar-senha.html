<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="tela-login">
    <div class="cartao-login">
      <h1 class="text-center mb-1" style="font-size:1.3rem;">Recuperar senha</h1>
      <p class="text-center text-muted mb-4" style="font-size:0.85rem;">
        Informe seu e-mail corporativo. Se estiver cadastrado, enviaremos um link de redefinição.
      </p>

      <div id="alerta-mensagem" class="alert d-none" role="alert"></div>

      <form id="form-recuperar">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <button type="submit" class="btn btn-roxo w-100">Enviar link de recuperação</button>
        <div class="text-center mt-3">
          <a href="login.html" style="font-size:0.85rem;">Voltar ao login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config/apiConfig.js"></script>
  <script>
    document.getElementById('form-recuperar').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const alerta = document.getElementById('alerta-mensagem');
      const email = document.getElementById('email').value.trim();

      try {
        const dados = await apiFetch('/auth/recuperar-senha', {
          method: 'POST',
          body: JSON.stringify({ email }),
        });
        alerta.className = 'alert alert-success';
        alerta.textContent = dados?.mensagem || 'Se o e-mail existir, um link foi enviado.';
        alerta.classList.remove('d-none');
      } catch (erro) {
        alerta.className = 'alert alert-danger';
        alerta.textContent = erro.message;
        alerta.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
