<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Feedbacks</h1>
        <button class="btn btn-roxo" data-bs-toggle="modal" data-bs-target="#modal-feedback" onclick="prepararModalNovo()">
          <i class="bi bi-plus-lg"></i> Novo Feedback
        </button>
      </div>

      <div class="cartao-conteudo">
        <h2 style="font-size:1rem;">Feedbacks recebidos</h2>
        <div id="area-lista">
          <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-feedback" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-feedback">
          <div class="modal-header">
            <h5 class="modal-title">Novo Feedback</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-modal" class="alert alert-danger d-none"></div>
            <div class="mb-3">
              <label class="form-label">Colaborador</label>
              <select class="form-select" id="colaboradorId" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo</label>
              <select class="form-select" id="tipo" required>
                <option value="positivo">Positivo</option>
                <option value="construtivo">Construtivo</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Mensagem</label>
              <textarea class="form-control" id="mensagem" rows="4" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-roxo">Registrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('feedbacks.html');
    let modalFeedback;

    async function carregarLista() {
      const areaLista = document.getElementById('area-lista');
      try {
        const resultado = await apiFetch('/feedbacks/meus?tamanhoPagina=100');
        if (resultado.registros.length === 0) {
          areaLista.innerHTML = '<p class="estado-vazio">Você ainda não recebeu nenhum feedback.</p>';
          return;
        }
        areaLista.innerHTML = resultado.registros
          .map(
            (feedback) => `
            <div class="border-bottom py-3">
              <span class="badge-status ${feedback.tipo === 'positivo' ? 'concluida' : 'pendente'}">${feedback.tipo}</span>
              <p class="mb-1 mt-2">${feedback.mensagem}</p>
              <small class="text-muted">${new Date(feedback.created_at).toLocaleString('pt-BR')}</small>
            </div>`
          )
          .join('');
      } catch (erro) {
        areaLista.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    async function prepararModalNovo() {
      const alertaModal = document.getElementById('alerta-modal');
      alertaModal.classList.add('d-none');
      document.getElementById('form-feedback').reset();
      try {
        const colaboradores = await apiFetch('/colaboradores?tamanhoPagina=200');
        document.getElementById('colaboradorId').innerHTML = colaboradores.registros
          .map((c) => `<option value="${c.id}">${c.cpf} (${c.id.substring(0, 8)}...)</option>`)
          .join('');
      } catch (erro) {
        alertaModal.textContent = 'Você não tem permissão para listar colaboradores.';
        alertaModal.classList.remove('d-none');
      }
    }

    document.getElementById('form-feedback').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const alertaModal = document.getElementById('alerta-modal');
      alertaModal.classList.add('d-none');
      try {
        await apiFetch('/feedbacks', {
          method: 'POST',
          body: JSON.stringify({
            colaboradorId: document.getElementById('colaboradorId').value,
            tipo: document.getElementById('tipo').value,
            mensagem: document.getElementById('mensagem').value,
          }),
        });
        modalFeedback.hide();
        carregarLista();
      } catch (erro) {
        alertaModal.textContent = erro.detalhes?.erros?.join(' ') || erro.message;
        alertaModal.classList.remove('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      modalFeedback = new bootstrap.Modal(document.getElementById('modal-feedback'));
    });

    carregarLista();
  </script>
</body>
</html>
