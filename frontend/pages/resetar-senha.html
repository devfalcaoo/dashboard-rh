<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gestão de Desempenho</title>

    <!-- ============================================================= -->
    <!-- Bootstrap                                                     -->
    <!-- ============================================================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- ============================================================= -->
    <!-- Estilos do projeto                                            -->
    <!-- ============================================================= -->

    <link rel="stylesheet" href="../css/variaveis.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/componentes.css">

</head>

<body>

    <div class="tela-login">

        <div class="cartao-login">

            <h1 class="text-center mb-2">

                Redefinir Senha

            </h1>

            <p class="text-center text-muted mb-4">

                Informe uma nova senha para acessar o sistema.

            </p>

            <!-- ===================================================== -->
            <!-- Área utilizada para exibir mensagens ao usuário       -->
            <!-- ===================================================== -->

            <div id="alerta"
                 class="alert d-none"
                 role="alert"></div>

            <!-- ===================================================== -->
            <!-- Formulário                                            -->
            <!-- ===================================================== -->

            <form id="form-resetar-senha">

                <div class="mb-3">

                    <label
                        for="novaSenha"
                        class="form-label">

                        Nova senha

                    </label>

                    <input
                        type="password"
                        id="novaSenha"
                        class="form-control"
                        minlength="6"
                        required>

                </div>

                <div class="mb-4">

                    <label
                        for="confirmarSenha"
                        class="form-label">

                        Confirmar senha

                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        class="form-control"
                        minlength="6"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-roxo w-100">

                    Alterar Senha

                </button>

            </form>

        </div>

    </div>

    <!-- ============================================================= -->
    <!-- SDK do Supabase                                               -->
    <!-- ============================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ============================================================= -->
    <!-- Configuração do Supabase                                      -->
    <!-- ============================================================= -->

    <script src="../js/config/supabase.js"></script>

    <!-- ============================================================= -->
    <!-- Lógica da redefinição de senha                                -->
    <!-- ============================================================= -->

    <script src="../js/auth/resetarSenha.js"></script>

</body>

</html>
