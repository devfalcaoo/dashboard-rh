<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colaboradores - Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Colaboradores</h1>
        <button class="btn btn-roxo" data-bs-toggle="modal" data-bs-target="#modal-colaborador" onclick="abrirModalNovo()">
          <i class="bi bi-plus-lg"></i> Novo Colaborador
        </button>
      </div>

      <div class="cartao-conteudo">
        <div id="area-tabela">
          <div class="text-center text-muted py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de cadastro/edicao -->
  <div class="modal fade" id="modal-colaborador" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-colaborador">
          <div class="modal-header">
            <h5 class="modal-title" id="titulo-modal">Novo Colaborador</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="alerta-modal" class="alert alert-danger d-none"></div>

            <input type="hidden" id="colaborador-id" />

            <div class="mb-3" id="grupo-usuario">
              <label class="form-label">Usuário vinculado</label>
              <select class="form-select" id="usuarioId" required></select>
              <div class="form-text">Todo colaborador deve corresponder a um usuário já cadastrado.</div>
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" maxlength="11" placeholder="Somente números" required />
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" placeholder="DDD + número" />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Data de admissão</label>
              <input type="date" class="form-control" id="dataAdmissao" />
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Departamento</label>
                <select class="form-select" id="departamentoId"><option value="">-</option></select>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Cargo</label>
                <select class="form-select" id="cargoId"><option value="">-</option></select>
              </div>
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Líder</label>
                <select class="form-select" id="liderId"><option value="">-</option></select>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Gestor</label>
                <select class="form-select" id="gestorId"><option value="">-</option></select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-roxo">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('colaboradores.html');

    let modalColaborador;
    let colaboradoresCache = [];

    async function carregarSelects() {
      const [usuarios, departamentos, cargos] = await Promise.all([
        apiFetch('/usuarios?tamanhoPagina=200'),
        apiFetch('/departamentos?tamanhoPagina=200'),
        apiFetch('/cargos?tamanhoPagina=200'),
      ]);

      preencherSelect('usuarioId', usuarios.registros, (u) => `${u.nome} (${u.email})`);
      preencherSelect('departamentoId', departamentos.registros, (d) => d.nome, true);
      preencherSelect('cargoId', cargos.registros, (c) => c.nome, true);
    }

    function preencherSelect(idSelect, itens, rotuloFn, manterVazio) {
      const select = document.getElementById(idSelect);
      const vazio = manterVazio ? '<option value="">-</option>' : '';
      select.innerHTML = vazio + itens.map((item) => `<option value="${item.id}">${rotuloFn(item)}</option>`).join('');
    }

    function preencherSelectColaboradores() {
      const opcoes = '<option value="">-</option>' + colaboradoresCache
        .map((c) => `<option value="${c.id}">${c.cpf} (${c.id.substring(0, 8)}...)</option>`)
        .join('');
      document.getElementById('liderId').innerHTML = opcoes;
      document.getElementById('gestorId').innerHTML = opcoes;
    }

    async function carregarTabela() {
      const areaTabela = document.getElementById('area-tabela');
      try {
        const resultado = await apiFetch('/colaboradores?tamanhoPagina=100');
        colaboradoresCache = resultado.registros;
        preencherSelectColaboradores();

        if (resultado.registros.length === 0) {
          areaTabela.innerHTML = '<p class="estado-vazio">Nenhum colaborador cadastrado ainda. Clique em "Novo Colaborador" para começar.</p>';
          return;
        }

        const linhas = resultado.registros
          .map(
            (c) => `
            <tr>
              <td class="valor-dado">${c.cpf}</td>
              <td>${c.telefone || '-'}</td>
              <td>${c.data_admissao || '-'}</td>
              <td><span class="badge-status ${c.ativo ? 'concluida' : 'cancelada'}">${c.ativo ? 'Ativo' : 'Inativo'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-secondary" onclick="abrirModalEditar('${c.id}')">
                  <i class="bi bi-pencil"></i> Editar
                </button>
              </td>
            </tr>`
          )
          .join('');

        areaTabela.innerHTML = `
          <table class="table tabela-padrao">
            <thead><tr><th>CPF</th><th>Telefone</th><th>Admissão</th><th>Status</th><th></th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>`;
      } catch (erro) {
        areaTabela.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    async function abrirModalNovo() {
      document.getElementById('form-colaborador').reset();
      document.getElementById('colaborador-id').value = '';
      document.getElementById('titulo-modal').textContent = 'Novo Colaborador';
      document.getElementById('grupo-usuario').classList.remove('d-none');
      document.getElementById('alerta-modal').classList.add('d-none');
      await carregarSelects();
    }

    async function abrirModalEditar(id) {
      const colaborador = colaboradoresCache.find((c) => c.id === id);
      await carregarSelects();

      document.getElementById('colaborador-id').value = colaborador.id;
      document.getElementById('titulo-modal').textContent = 'Editar Colaborador';
      document.getElementById('grupo-usuario').classList.add('d-none');
      document.getElementById('cpf').value = colaborador.cpf;
      document.getElementById('telefone').value = colaborador.telefone || '';
      document.getElementById('dataAdmissao').value = colaborador.data_admissao || '';
      document.getElementById('departamentoId').value = colaborador.departamento_id || '';
      document.getElementById('cargoId').value = colaborador.cargo_id || '';
      document.getElementById('liderId').value = colaborador.lider_id || '';
      document.getElementById('gestorId').value = colaborador.gestor_id || '';
      document.getElementById('alerta-modal').classList.add('d-none');

      modalColaborador.show();
    }

    document.getElementById('form-colaborador').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const alertaModal = document.getElementById('alerta-modal');
      alertaModal.classList.add('d-none');

      const id = document.getElementById('colaborador-id').value;
      const payload = {
        cpf: document.getElementById('cpf').value.trim(),
        telefone: document.getElementById('telefone').value.trim() || undefined,
        dataAdmissao: document.getElementById('dataAdmissao').value || undefined,
        departamentoId: document.getElementById('departamentoId').value || undefined,
        cargoId: document.getElementById('cargoId').value || undefined,
        liderId: document.getElementById('liderId').value || undefined,
        gestorId: document.getElementById('gestorId').value || undefined,
      };

      try {
        if (id) {
          await apiFetch(`/colaboradores/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          payload.usuarioId = document.getElementById('usuarioId').value;
          await apiFetch('/colaboradores', { method: 'POST', body: JSON.stringify(payload) });
        }
        modalColaborador.hide();
        carregarTabela();
      } catch (erro) {
        alertaModal.textContent = erro.detalhes?.erros?.join(' ') || erro.message;
        alertaModal.classList.remove('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      modalColaborador = new bootstrap.Modal(document.getElementById('modal-colaborador'));
    });

    carregarTabela();
  </script>
</body>
</html>
