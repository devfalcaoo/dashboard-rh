<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios - Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Relatórios</h1>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="cartao-conteudo">
            <h2 style="font-size:1rem;"><i class="bi bi-bar-chart"></i> Resumo gerencial</h2>
            <p class="text-muted" style="font-size:0.85rem;">Indicadores consolidados da empresa (ou de um ciclo específico).</p>
            <div class="mb-3">
              <label class="form-label">Ciclo (opcional)</label>
              <select class="form-select" id="ciclo-resumo"><option value="">Todos os ciclos</option></select>
            </div>
            <button class="btn btn-outline-secondary me-2" onclick="baixarRelatorio('resumo', 'pdf')"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
            <button class="btn btn-outline-secondary" onclick="baixarRelatorio('resumo', 'xlsx')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          </div>
        </div>

        <div class="col-md-6">
          <div class="cartao-conteudo">
            <h2 style="font-size:1rem;"><i class="bi bi-clipboard-check"></i> Avaliações do ciclo</h2>
            <p class="text-muted" style="font-size:0.85rem;">Lista detalhada de todas as avaliações de um ciclo específico.</p>
            <div class="mb-3">
              <label class="form-label">Ciclo</label>
              <select class="form-select" id="ciclo-avaliacoes" required></select>
            </div>
            <button class="btn btn-outline-secondary me-2" onclick="baixarRelatorio('avaliacoes', 'pdf')"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
            <button class="btn btn-outline-secondary" onclick="baixarRelatorio('avaliacoes', 'xlsx')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('relatorios.html');

    async function carregarCiclos() {
      try {
        const ciclos = await apiFetch('/ciclos-avaliacao?tamanhoPagina=100');
        const opcoes = ciclos.registros.map((c) => `<option value="${c.id}">${c.nome}</option>`).join('');
        document.getElementById('ciclo-resumo').insertAdjacentHTML('beforeend', opcoes);
        document.getElementById('ciclo-avaliacoes').innerHTML = opcoes;
      } catch (erro) {
        console.warn('Nao foi possivel carregar ciclos:', erro.message);
      }
    }

    async function baixarRelatorio(tipo, formato) {
      try {
        const cicloId = tipo === 'resumo'
          ? document.getElementById('ciclo-resumo').value
          : document.getElementById('ciclo-avaliacoes').value;

        if (tipo === 'avaliacoes' && !cicloId) {
          alert('Selecione um ciclo para gerar este relatório.');
          return;
        }

        const query = cicloId ? `?formato=${formato}&cicloId=${cicloId}` : `?formato=${formato}`;
        const blob = await apiFetch(`/relatorios/${tipo}${query}`, {}, { binario: true });
        baixarArquivo(blob, `relatorio-${tipo}.${formato === 'pdf' ? 'pdf' : 'xlsx'}`);
      } catch (erro) {
        alert(erro.message);
      }
    }

    carregarCiclos();
  </script>
</body>
</html>
