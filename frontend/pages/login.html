<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar - Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="tela-login">
    <div class="cartao-login">
      <h1 class="text-center mb-1" style="font-size:1.4rem;">Gestão de Desempenho</h1>
      <p class="text-center text-muted mb-4" style="font-size:0.88rem;">Entre com as suas credenciais corporativas</p>

      <div id="alerta-erro" class="alert alert-danger d-none" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-roxo w-100" id="botao-entrar">
          <span id="texto-botao">Entrar</span>
          <span id="spinner-botao" class="spinner-border spinner-border-sm d-none ms-1"></span>
        </button>
        <div class="text-center mt-3">
          <a href="recuperar-senha.html" style="font-size:0.85rem;">Esqueci minha senha</a>
        </div>
      </form>
      <p class="text-center mt-4" style="font-size:1rem;"> 
      <small class="text-muted">© 2026 Gestão de Desempenho - Desenvolvido por Falcão. Todos os direitos reservados.</small>
      </p>
    </div>
  </div>

  <script src="../js/config/apiConfig.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (evento) => {
      evento.preventDefault();

      const alertaErro = document.getElementById('alerta-erro');
      const botaoEntrar = document.getElementById('botao-entrar');
      const textoBotao = document.getElementById('texto-botao');
      const spinnerBotao = document.getElementById('spinner-botao');

      alertaErro.classList.add('d-none');
      botaoEntrar.disabled = true;
      textoBotao.textContent = 'Entrando...';
      spinnerBotao.classList.remove('d-none');

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const dados = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, senha }),
        });

        salvarSessao({ accessToken: dados.sessao.accessToken, usuario: dados.usuario });
        window.location.href = 'dashboard.html';
      } catch (erro) {
        alertaErro.textContent = erro.message;
        alertaErro.classList.remove('d-none');
        botaoEntrar.disabled = false;
        textoBotao.textContent = 'Entrar';
        spinnerBotao.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
