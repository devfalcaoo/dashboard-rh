<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Desempenho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <div class="shell">
    <div class="conteudo-principal">
      <div class="pagina-header">
        <h1>Plano de Desenvolvimento Individual</h1>
      </div>
      <div class="cartao-conteudo">
        <div id="area-lista">
          <div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config/apiConfig.js"></script>
  <script src="../js/components/shell.js"></script>
  <script>
    exigirSessao();
    renderizarShell('pdi.html');

    async function carregarLista() {
      const areaLista = document.getElementById('area-lista');
      try {
        const resultado = await apiFetch('/pdis/meus?tamanhoPagina=100');
        if (resultado.registros.length === 0) {
          areaLista.innerHTML = '<p class="estado-vazio">Você não possui PDIs no momento.</p>';
          return;
        }
        areaLista.innerHTML = resultado.registros
          .map(
            (pdi) => `
            <div class="border-bottom py-3">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <p class="mb-1 fw-semibold">${pdi.objetivo}</p>
                  <span class="badge-status ${pdi.status}">${pdi.status.replace('_', ' ')}</span>
                  ${pdi.prazo ? `<small class="text-muted ms-2">Prazo: ${pdi.prazo}</small>` : ''}
                </div>
                <div style="min-width:160px;">
                  <div class="progress" role="progressbar" style="height:8px;">
                    <div class="progress-bar bg-success" style="width:${pdi.progresso}%"></div>
                  </div>
                  <small class="text-muted">${pdi.progresso}%</small>
                </div>
              </div>
              ${
                pdi.status !== 'concluido'
                  ? `<div class="input-group input-group-sm mt-2" style="max-width:260px;">
                       <input type="number" min="0" max="100" class="form-control" id="progresso-${pdi.id}" placeholder="Novo progresso (%)">
                       <button class="btn btn-outline-secondary" onclick="atualizarProgresso('${pdi.id}')">Atualizar</button>
                     </div>`
                  : ''
              }
            </div>`
          )
          .join('');
      } catch (erro) {
        areaLista.innerHTML = `<div class="alert alert-danger">${erro.message}</div>`;
      }
    }

    async function atualizarProgresso(id) {
      const campo = document.getElementById(`progresso-${id}`);
      try {
        await apiFetch(`/pdis/${id}/progresso`, {
          method: 'PATCH',
          body: JSON.stringify({ progresso: Number(campo.value) }),
        });
        carregarLista();
      } catch (erro) {
        alert(erro.message);
      }
    }

    carregarLista();
  </script>
</body>
</html>
